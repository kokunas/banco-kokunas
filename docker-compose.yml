services:
  postgres:
    image: postgres:16-alpine
    container_name: banco-kokunas-db
    environment:
      POSTGRES_DB: banco_kokunas
      POSTGRES_USER: banco_kokunas
      POSTGRES_PASSWORD: banco_kokunas
    ports:
      - "5432:5432"
    volumes:
      - banco-kokunas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_kokunas -d banco_kokunas"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banco-kokunas-internal

  app:
    build: .
    container_name: banco-kokunas-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banco_kokunas
      DB_USER: banco_kokunas
      DB_PASSWORD: banco_kokunas
    ports:
      - "8080:8080"
    networks:
      - banco-kokunas-internal
      - banco-kokunas-public

networks:
  banco-kokunas-public:
    driver: bridge
  banco-kokunas-internal:
    driver: bridge
    internal: true

volumes:
  banco-kokunas-db-data:
